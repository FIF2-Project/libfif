name: Bug report
description: The encoder, decoder or fif tool does something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Questions about the file format itself belong to the
        FIF2 specification at https://fif2.org.
  - type: textarea
    id: version
    attributes:
      label: fif version
      description: Paste the full output of `fif version`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS (Apple Silicon), macOS (Intel), Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get fif?
      options: [Release download, Built from source]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command line you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the full error output. Attach the input picture or .fif file if you can.
    validations:
      required: true
